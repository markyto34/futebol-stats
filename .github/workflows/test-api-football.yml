name: Testar ligação API-Football

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api-status:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Consultar estado da API sem expor a chave
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${API_FOOTBALL_KEY:-}" ]; then
            echo "::error::O secret API_FOOTBALL_KEY não está configurado."
            exit 1
          fi

          response=$(curl --silent --show-error --fail-with-body \
            --max-time 20 \
            --header "x-apisports-key: ${API_FOOTBALL_KEY}" \
            "https://v3.football.api-sports.io/status")

          # Mostrar apenas os campos de estado e quotas; nunca imprimir a chave.
          printf '%s' "$response" | python -c '
import json, sys
data = json.load(sys.stdin)
errors = data.get("errors")
if errors:
    print("A API devolveu erros:", json.dumps(errors, ensure_ascii=False))
    raise SystemExit(1)
account = data.get("response", {}).get("requests", {})
print("Ligação à API-Football estabelecida.")
print("Pedidos usados hoje:", account.get("current", "não indicado"))
print("Limite diário:", account.get("limit_day", "não indicado"))
'
